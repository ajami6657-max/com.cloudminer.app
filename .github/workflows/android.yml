name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare named APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CLOUD-MINER.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLOUD-MINER
          path: release/CLOUD-MINER.apk
